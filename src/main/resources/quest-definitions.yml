quests:

  # ============================================================
  # MAIN QUESTS
  # Automatically active. No NPC required.
  # ============================================================

  slayer_1000:
    type: MAIN
    name: "Slayer I"
    prerequisite: ""

    objectives:
      - id: kills
        type: KILL_HOSTILE_MOBS
        description: "Hostile Mobs Killed"
        amount: 1000

    rewards:
      souls: 2500
      gems: 100

  world_explorer:
    type: MAIN
    name: "World Explorer"
    prerequisite: ""

    objectives:
      - id: locations
        type: VISIT_UNIQUE_LOCATIONS
        description: "Locations Discovered"
        targets:
          - blackthorn_village
          - kings_rest
          - duskport
          - nattamata
          - ancient_sanctum
          - ironhold
          - blossom_reach
          - goblin_depths

    rewards:
      souls: 5000
      gems: 500

  # Example for later when you have the exact custom MobType IDs:
  #
  # bestiary:
  #   type: MAIN
  #   name: "Bestiary"
  #   prerequisite: ""
